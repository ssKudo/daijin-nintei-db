name: Check and refresh MLIT ledgers

on:
  schedule:
    # Monday 06:17 JST
    - cron: '17 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: mlit-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pipeline dependencies
        run: python -m pip install '.[pipeline,dev]' 'PyMuPDF==1.26.7'
      - name: Check PDF contents and rebuild changed data
        run: python -X utf8 scripts/refresh_mlit_ledger.py
      - name: Verify changed datasets
        run: |
          if ! git diff --quiet -- data docs/data daijin_nintei/bundled_code_rules.json; then
            python -X utf8 -m pytest
            node tests/check_web_ledger.cjs
          fi
      - name: Commit the verified update or check log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md data docs/index.html docs/data daijin_nintei/bundled_code_rules.json maintenance
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'data: check and refresh MLIT ledgers'
            git push origin HEAD:main
          fi
      - name: Request Pages build if the public ledger differs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for path in data/manifest.json data/code_rules.json; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              "https://sskudo.github.io/daijin-nintei-db/$path" --output "$RUNNER_TEMP/public-mlit.json"
            if ! cmp -s "docs/$path" "$RUNNER_TEMP/public-mlit.json"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
              break
            fi
          done
